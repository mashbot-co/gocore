<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 40px 20px; color: #1a1a1a; background: #f9fafb;">
  <div style="text-align: center; margin-bottom: 24px;">
    <img src="{{.LogoURL}}" alt="Timeslot" width="111" height="36" style="width: 111px; height: 36px;" />
  </div>
  <div style="background: #fff; border-radius: 12px; padding: 32px; border: 1px solid #e5e7eb;">
    <h2 style="font-weight: 600; font-size: 20px; margin: 0 0 8px;">New access request</h2>
    <p style="color: #64748b; font-size: 15px; line-height: 1.6; margin: 0 0 16px;">{{.RequesterName}} ({{.RequesterEmail}}) has requested that the following people be added to the project:</p>
    <ul style="margin: 0 0 24px; padding-left: 20px; color: #1a1a1a;">
      {{range .Emails}}
      <li style="padding: 4px 0; font-size: 14px;">{{.}}</li>
      {{end}}
    </ul>
    <a href="{{.ReviewURL}}" style="background: #171717; color: #fff; padding: 12px 24px; border-radius: 999px; text-decoration: none; display: inline-block; font-size: 14px; font-weight: 500;">Review requests</a>
  </div>
</body>
</html>
